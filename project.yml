name: LeNuage
options:
  bundleIdPrefix: com.jeromedubos
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Schéma partagé de l'app : c'est CELUI qu'on lance (jamais le widget seul).
# Défini explicitement pour qu'il ne disparaisse plus à la régénération.
schemes:
  LeNuage:
    build:
      targets:
        LeNuage: all
    run:
      config: Debug
    archive:
      config: Release

settings:
  base:
    MARKETING_VERSION: "1.10"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Personal Team de Jérôme (signature gratuite). Permanent malgré les régénérations.
    DEVELOPMENT_TEAM: "7AZ4QCLZAA"

targets:
  # ---- Application -------------------------------------------------------
  LeNuage:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Assets.xcassets
      - path: Nuages.xcassets
      - path: svg
        type: folder
      - path: svg-doux
        type: folder
      - path: svg-accessoires
        type: folder
      - path: vannes-taquines.json
      - path: messages-doux.json
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Le Nuage
        # Version pilotée par MARKETING_VERSION (un seul endroit à bumper par release)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: >-
          Le Nuage utilise ta position pour afficher la météo de l'endroit où tu te trouves.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeromedubos.lenuage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/LeNuage.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jeromedubos.lenuage
    dependencies:
      - target: LeNuageWidgetExtension

  # ---- Extension widget --------------------------------------------------
  LeNuageWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Nuages.xcassets
      - path: vannes-taquines.json
      - path: messages-doux.json
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Le Nuage
        # L'extension DOIT suivre la version de l'app, sinon iOS ne ré-enregistre jamais
        # les nouvelles tailles de widget (il la croit inchangée).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeromedubos.lenuage.widget
    entitlements:
      path: Widget/LeNuageWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jeromedubos.lenuage
